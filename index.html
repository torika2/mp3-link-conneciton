<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="referrer" content="origin" />
<title>Car Radio YouTube Player</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; font-family: Arial, sans-serif; }
    #tile { position: fixed; top: 8px; right: 8px; width: 240px; height: 240px; }
    #yt { width: 240px; height: 240px; }
  </style>
  </head>
  <body>
    <div id="tile">
      <div id="yt"></div>
    </div>
  <script>
    var player = null;
    var ready = false;
    var currentId = null;
    var currentUrl = null;
    var currentTrackKey = null;
    var vehicleId = -1;
    var pending = null;
    var wantVolume = 50;
    var wantSeekMs = 0;
    var finishReported = false;

    function report(message) {
      try { if (typeof mp !== 'undefined') mp.trigger('carradio:audio:log', String(message)); } catch (e) {}
    }

    function videoIdFromUrl(raw) {
      try {
        var url = new URL(String(raw));
        var host = url.hostname.toLowerCase();
        var parts = url.pathname.split('/').filter(Boolean);
        var id = '';
        if (host === 'youtu.be' || host === 'www.youtu.be') id = parts[0] || '';
        else if (['youtube.com', 'www.youtube.com', 'm.youtube.com', 'music.youtube.com'].indexOf(host) >= 0) {
          if (url.pathname === '/watch') id = url.searchParams.get('v') || '';
          else if (['embed', 'shorts', 'live', 'v'].indexOf(parts[0]) >= 0) id = parts[1] || '';
        }
        return /^[A-Za-z0-9_-]{11}$/.test(id) ? id : '';
      } catch (e) { return ''; }
    }

    function sendMetadata() {
      if (!player || !currentId || !currentUrl) return;
      var data = player.getVideoData ? player.getVideoData() : {};
      if (data.video_id && data.video_id !== currentId) return;
      var meta = {
        id: vehicleId,
        url: currentUrl,
        title: data.title || '',
        artist: data.author || 'YouTube',
        artwork: 'https://i.ytimg.com/vi/' + currentId + '/hqdefault.jpg'
      };
      try { if (typeof mp !== 'undefined') mp.trigger('carradio:audio:meta', JSON.stringify(meta)); } catch (e) {}
    }

    function reportFinish(expectedId, expectedTrackKey) {
      if (finishReported || currentId !== expectedId || currentTrackKey !== expectedTrackKey) return;
      finishReported = true;
      try { if (typeof mp !== 'undefined') mp.trigger('carradio:audio:finished', vehicleId); } catch (e) {}
    }

    function syncPosition(positionMs, trackKey) {
      wantSeekMs = Math.max(0, Number(positionMs) || 0);
      if (!ready || !player || trackKey !== currentTrackKey) return;
      try {
        if (player.getPlayerState() !== YT.PlayerState.PLAYING) return;
        var actualMs = player.getCurrentTime() * 1000;
        if (Math.abs(actualMs - wantSeekMs) > 1500) {
          player.seekTo(wantSeekMs / 1000, true);
          report('sync seek to ' + Math.round(wantSeekMs) + 'ms');
        }
      } catch (e) { report('sync position failed: ' + (e && e.message || e)); }
    }

    (function () {
      var tag = document.createElement('script');
      tag.src = 'https://www.youtube.com/iframe_api';
      document.head.appendChild(tag);
    })();

    window.onYouTubeIframeAPIReady = function () {
      player = new YT.Player('yt', {
        width: '240',
        height: '240',
        playerVars: {
          autoplay: 1,
          controls: 1,
          disablekb: 0,
          playsinline: 1,
          origin: location.origin
        },
        events: {
          onReady: function () {
            ready = true;
            try {
              var frame = player.getIframe();
              if (frame) {
                frame.setAttribute('referrerpolicy', 'origin');
                frame.setAttribute('allow', 'autoplay; encrypted-media; picture-in-picture');
              }
            } catch (e) {}
            if (pending) {
              var request = pending;
              pending = null;
              currentId = null;
              loadPending(request);
            }
          },
          onStateChange: function (event) {
            if (event.data === YT.PlayerState.PLAYING) {
              window.setVolume(wantVolume);
              sendMetadata();
              setTimeout(sendMetadata, 500);
              syncPosition(wantSeekMs, currentTrackKey);
            } else if (event.data === YT.PlayerState.ENDED) {
              var data = player.getVideoData ? player.getVideoData() : {};
              if (!data.video_id || data.video_id === currentId) reportFinish(currentId, currentTrackKey);
            }
          },
          onError: function (event) {
            var failedId = currentId;
            var failedTrackKey = currentTrackKey;
            report('video unavailable (YouTube error ' + event.data + ')');
            setTimeout(function () { reportFinish(failedId, failedTrackKey); }, 1500);
          },
          onAutoplayBlocked: function () {
            report('autoplay blocked; click the YouTube player to start');
          }
        }
      });
    };

    function loadPending(request) {
      if (!ready || !player) { pending = request; return; }
      if (currentTrackKey === request.trackKey && currentUrl === request.url) return;
      currentId = request.videoId;
      currentUrl = request.url;
      currentTrackKey = request.trackKey;
      vehicleId = request.vehicleId;
      wantSeekMs = Math.max(0, Number(request.seekMs) || 0);
      finishReported = false;
      player.loadVideoById({
        videoId: currentId,
        startSeconds: wantSeekMs / 1000
      });
      player.playVideo();
    }

    window.loadTrack = function (url, seekMs, id, trackKey) {
      var videoId = videoIdFromUrl(url);
      if (!videoId) { report('Unsupported YouTube URL'); return; }
      var key = String(trackKey || url);
      if (currentUrl === url && currentId === videoId && currentTrackKey === key) return;
      loadPending({ url: String(url), videoId: videoId, seekMs: seekMs, vehicleId: Number(id), trackKey: key });
    };

    window.syncTrack = function (positionMs, trackKey) {
      var key = String(trackKey);
      if (pending && pending.trackKey === key && currentTrackKey !== key) {
        pending.seekMs = positionMs;
        return;
      }
      syncPosition(positionMs, key);
    };

    window.setVolume = function (volume) {
      wantVolume = Math.max(0, Math.min(100, Number(volume) || 0));
      if (!ready || !player) return;
      if (wantVolume <= 0) player.mute();
      else { player.unMute(); player.setVolume(wantVolume); }
    };

    window.setScene = function () {};

    window.setTile = function (slot, total) {
      var tileWidth = 248, tileHeight = 248, margin = 8;
      var columns = Math.max(1, Math.floor((window.innerWidth - margin * 2) / tileWidth));
      var index = Math.max(0, Number(slot) || 0);
      var column = index % columns;
      var row = Math.floor(index / columns);
      var tile = document.getElementById('tile');
      tile.style.left = Math.max(margin, window.innerWidth - margin - tileWidth * (column + 1)) + 'px';
      tile.style.right = 'auto';
      tile.style.top = (margin + row * tileHeight) + 'px';
    };
  </script>
</body>
</html>
